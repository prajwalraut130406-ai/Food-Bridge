spring.application.name=FoodBridge
server.port=8080

# ---- Default: file-based H2 so the app runs out of the box ----
#spring.datasource.url=jdbc:h2:file:./data/foodbridge;AUTO_SERVER=TRUE
#spring.datasource.username=sa
#spring.datasource.password=

# ---- MySQL (uncomment and comment out the H2 block above) ----
spring.datasource.url=jdbc:mysql://localhost:3306/foodbridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---- PostgreSQL ----
#spring.datasource.url=jdbc:postgresql://localhost:5432/foodbridge
#spring.datasource.username=postgres
#spring.datasource.password=your_password
# (add org.postgresql:postgresql runtime dependency to pom.xml)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf cache off for development
spring.thymeleaf.cache=false

# ---- Food photo upload ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
