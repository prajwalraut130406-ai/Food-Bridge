<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12332c">
    <title th:text="${title} + ' | FoodBridge'">FoodBridge</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/foodbridge.css}">
</head>
<body>

<!-- Logo mark: an arch (the bridge) over a plate -->
<svg th:fragment="logo" class="fb-brand-mark" viewBox="0 0 40 40" aria-hidden="true">
    <rect width="40" height="40" rx="10" fill="#1d7a4c"/>
    <path d="M6 27 C6 12 34 12 34 27" fill="none" stroke="#f0a500" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M4 29.5 H36" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="20" cy="21.5" r="3.2" fill="#fff"/>
</svg>

<nav th:fragment="navbar(role)" class="navbar fb-nav mb-4">
    <div class="container">
        <a class="fb-brand" href="/">
            <svg th:replace="~{fragments :: logo}"></svg>
            <span class="fb-brand-name">FoodBridge</span>
            <span class="fb-role" th:text="${role}">role</span>
        </a>
        <div class="fb-user">
            <span class="fb-avatar" aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">U</span>
            <span class="fb-user-name" th:text="${#authentication.name}">user</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm fb-logout">Log out</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

<th:block th:fragment="leaflet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</th:block>

<!-- Veg / non-veg mark -->
<span th:fragment="diet(t)" class="diet" th:classappend="${t.name() == 'VEG'} ? 'diet-veg' : 'diet-nonveg'"
      th:title="${t.label}" role="img" th:attr="aria-label=${t.label}"></span>

<!-- Full breakdown of a donation: items, type, quantity, approximate value, total -->
<table th:fragment="itemsTable(d)" class="table table-sm align-middle mb-2">
    <thead>
    <tr><th>Item</th><th class="text-end">Quantity</th><th class="text-end">Approx. value</th></tr>
    </thead>
    <tbody>
    <tr th:each="i : ${d.items}">
        <td>
            <span th:replace="~{fragments :: diet(${i.foodType})}"></span>
            <span class="ms-1" th:text="${i.itemName}">Dal tadka</span>
        </td>
        <td class="text-end text-nowrap" th:text="${i.displayQuantity + ' ' + i.unit.label}">5 kg</td>
        <td class="text-end text-nowrap" th:text="'₹ ' + ${#numbers.formatDecimal(i.approximatePrice, 1, 'COMMA', 2, 'POINT')}">₹ 0.00</td>
    </tr>
    </tbody>
    <tfoot>
    <tr class="fw-bold">
        <td colspan="2" class="text-end">Total approximate value</td>
        <td class="text-end money" th:text="'₹ ' + ${#numbers.formatDecimal(d.totalApproximateValue, 1, 'COMMA', 2, 'POINT')}">₹ 0.00</td>
    </tr>
    </tfoot>
</table>

<!-- Compact list of items for table cells -->
<ul th:fragment="itemsList(d)" class="items-list">
    <li th:each="i : ${d.items}">
        <span th:replace="~{fragments :: diet(${i.foodType})}"></span>
        <span th:text="${i.itemName + ' · ' + i.displayQuantity + ' ' + i.unit.label}">Dal tadka · 5 kg</span>
    </li>
</ul>

<!-- Food photo, or a neutral placeholder -->
<div th:fragment="foodPhoto(d, height)">
    <img th:if="${d.foodImageUrl != null}" th:src="@{${d.foodImageUrl}}" alt="Food photo" class="food-photo"
         th:style="'height:' + ${height} + 'px'">
    <div th:unless="${d.foodImageUrl != null}" class="food-photo-empty" th:style="'height:' + ${height} + 'px'">No photo</div>
</div>
</body>
</html>
